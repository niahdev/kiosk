<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>키오스크 진행 상황</title>
  <link rel="stylesheet" href="/kiosk.css">
  <link rel="stylesheet" href="/kiosk-print.css" media="print">
</head>
<body>
  <main>
    <nav class="language-switcher" aria-label="언어 선택" data-i18n-aria-label="languageSelection">
      <button class="language-button active" type="button" data-language="ko" aria-pressed="true">한국어</button>
      <button class="language-button" type="button" data-language="en" aria-pressed="false">English</button>
      <button class="language-button" type="button" data-language="ar" aria-pressed="false" lang="ar" dir="rtl">العربية</button>
    </nav>
    <section class="header">
      <div class="refresh-control">
        <button
          class="refresh-button"
          id="refreshPageButton"
          type="button"
          aria-label="새로고침"
          title="새로고침"
          data-i18n-aria-label="refreshPage"
          data-i18n-title="refreshPage"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"></path>
          </svg>
        </button>
      </div>
      <h1 data-i18n="heading">사용자별 프로젝트 현황</h1>
      <p data-i18n="intro">사용자를 터치하면 프로젝트 목록이 열리고, 프로젝트를 고르면 상세 화면이 열립니다</p>
      <div class="deadline-bar">
        <span><span data-i18n="currentTime">지금 시간</span>: <strong id="currentTime">-</strong></span>
      </div>
    </section>

    <p id="message" data-i18n="loading">불러오는 중...</p>

    <div class="user-list" id="projects"></div>
  </main>

  <div class="modal" id="userModal">
    <div class="modal-body modal-wide" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
      <h2 id="userModalTitle" data-i18n="userProjects">사용자 프로젝트</h2>
      <div class="student-id" id="userModalStudentId" dir="auto">-</div>
      <section class="detail-block">
        <h3 data-i18n="projectList">프로젝트 목록</h3>
        <div class="project-list" id="userProjectList"></div>
      </section>
      <div class="modal-actions">
        <button id="closeUserModalButton" type="button" data-i18n="close">닫기</button>
      </div>
    </div>
  </div>

  <div class="modal" id="projectModal">
    <div class="modal-body modal-wide" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle" data-i18n="projectPreview">프로젝트 미리보기</h2>
      <div class="student-id" id="modalStudentId" dir="auto">-</div>
      <div class="project-name" id="modalProjectName" dir="auto">-</div>

      <section class="detail-block">
        <h3 data-i18n="screenshot">스크린샷</h3>
        <div id="projectScreenshotBlock" class="screenshot-card">
          <p class="detail-copy" data-i18n="noScreenshot">아직 등록된 스크린샷이 없습니다.</p>
        </div>
      </section>

      <section class="detail-block" id="deploymentBlock" hidden>
        <h3 data-i18n="deployment">배포판</h3>
        <p class="detail-copy" id="deploymentUrlText" dir="ltr"></p>
        <button class="preview-button" id="openDeploymentButton" type="button" data-i18n="openDeploymentMockup">배포판 목업 열기</button>
      </section>

      <section class="detail-block" id="githubBlock" hidden>
        <h3 data-i18n="githubRepository">GitHub 저장소</h3>
        <p class="detail-copy" id="githubUrlText" dir="ltr"></p>
        <button class="preview-button" id="openGithubButton" type="button" data-i18n="openGithubRepository">GitHub 저장소 열기</button>
      </section>

      <section class="detail-block" id="projectDescriptionBlock" hidden>
        <h3 data-i18n="projectProcess">사용한 프롬프트 팁</h3>
        <p class="detail-copy project-description-copy" id="projectDescriptionText" dir="auto"></p>
      </section>

      <section class="detail-block">
        <h3 data-i18n="comments">코멘트</h3>
        <div class="comment-list" id="modalCommentList"></div>
        <form id="commentForm" class="comment-form">
          <input id="commentAuthorInput" type="text" placeholder="작성자 (예: kopo05)" data-i18n-placeholder="authorPlaceholder" dir="auto">
          <textarea id="commentInput" rows="3" placeholder="누구나 코멘트를 남길 수 있습니다" data-i18n-placeholder="commentPlaceholder" dir="auto"></textarea>
          <button type="submit" data-i18n="registerComment">코멘트 등록</button>
        </form>
      </section>

      <div class="modal-actions">
        <button id="closeModalButton" type="button" data-i18n="close">닫기</button>
      </div>
    </div>
  </div>

  <div class="deployment-preview" id="deploymentPreview" aria-hidden="true">
    <div class="deployment-preview-bar">
      <button id="closeDeploymentButton" type="button" data-i18n="closeScreen">화면닫기</button>
      <span id="deploymentPreviewTitle" data-i18n="deployment">배포판</span>
    </div>
    <iframe id="deploymentFrame" title="프로젝트 배포판 목업" data-i18n-title="deploymentFrameTitle"></iframe>
  </div>

  <script src="kiosk-i18n.js"></script>
  <script>
    const projectsTable = document.getElementById("projects");
    const message = document.getElementById("message");
    const userModal = document.getElementById("userModal");
    const userModalStudentId = document.getElementById("userModalStudentId");
    const userProjectList = document.getElementById("userProjectList");
    const closeUserModalButton = document.getElementById("closeUserModalButton");
    const modal = document.getElementById("projectModal");
    const modalStudentId = document.getElementById("modalStudentId");
    const modalProjectName = document.getElementById("modalProjectName");
    const deploymentBlock = document.getElementById("deploymentBlock");
    const deploymentUrlText = document.getElementById("deploymentUrlText");
    const githubBlock = document.getElementById("githubBlock");
    const githubUrlText = document.getElementById("githubUrlText");
    const openGithubButton = document.getElementById("openGithubButton");
    const projectDescriptionBlock = document.getElementById("projectDescriptionBlock");
    const projectDescriptionText = document.getElementById("projectDescriptionText");
    const openDeploymentButton = document.getElementById("openDeploymentButton");
    const deploymentPreview = document.getElementById("deploymentPreview");
    const closeDeploymentButton = document.getElementById("closeDeploymentButton");
    const deploymentFrame = document.getElementById("deploymentFrame");
    const deploymentPreviewTitle = document.getElementById("deploymentPreviewTitle");
    const projectScreenshotBlock = document.getElementById("projectScreenshotBlock");
    const modalCommentList = document.getElementById("modalCommentList");
    const closeModalButton = document.getElementById("closeModalButton");
    const commentForm = document.getElementById("commentForm");
    const commentAuthorInput = document.getElementById("commentAuthorInput");
    const commentInput = document.getElementById("commentInput");
    const languageButtons = document.querySelectorAll(".language-button");
    const refreshPageButton = document.getElementById("refreshPageButton");
    const {
      createKioskI18n,
      formatLocalizedProjectName
    } = window.KioskI18n;
    let allProjects = [];
    let latestProjects = [];
    let latestUsers = [];
    let projectsLoaded = false;
    let activeProjectId = null;
    let activeDeploymentUrl = "";
    let activeGithubUrl = "";
    let activeFrameStatus = null;
    let activeProject = null;
    let activeComments = [];
    let activeUser = null;
    let currentI18n = createKioskI18n(readSavedLanguage());
    const frameCheckCache = new Map();
    const EXTERNAL_WINDOW_TIMEOUT_MS = 2 * 60 * 1000;

    function readSavedLanguage() {
      try {
        return localStorage.getItem("kiosk-language") || "ko";
      } catch {
        return "ko";
      }
    }

    function saveLanguage(locale) {
      try {
        localStorage.setItem("kiosk-language", locale);
      } catch {
        // The language still changes when browser storage is unavailable.
      }
    }

    function t(key, values) {
      return currentI18n.t(key, values);
    }

    function getDisplayProjectName(project) {
      return formatLocalizedProjectName(
        project.studentId,
        project.projectName,
        currentI18n.locale
      );
    }

    function applyFixedTranslations() {
      document.title = t("pageTitle");
      document.documentElement.lang = currentI18n.locale;
      document.documentElement.dir = currentI18n.direction;

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        element.placeholder = t(element.dataset.i18nPlaceholder);
      });
      document.querySelectorAll("[data-i18n-aria-label]").forEach((element) => {
        element.setAttribute("aria-label", t(element.dataset.i18nAriaLabel));
      });
      document.querySelectorAll("[data-i18n-title]").forEach((element) => {
        element.title = t(element.dataset.i18nTitle);
      });
    }

    function setLanguage(locale, persist = true) {
      currentI18n = createKioskI18n(locale);
      if (persist) saveLanguage(currentI18n.locale);

      languageButtons.forEach((button) => {
        const isActive = button.dataset.language === currentI18n.locale;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      applyFixedTranslations();
      if (projectsLoaded) renderProjectsTable();
      if (activeUser && userModal.classList.contains("open")) renderUserProjectList(activeUser);
      if (modal.classList.contains("open")) {
        if (activeProject) {
          modalProjectName.textContent = getDisplayProjectName(activeProject);
        }
        renderComments(activeComments);
        if (activeProject) renderProjectScreenshot(activeProject);
        applyDeploymentButtonStatus(activeFrameStatus);
      }
      if (deploymentPreview.classList.contains("open") && activeProject) {
        deploymentPreviewTitle.textContent = t("deploymentMockupTitle", {
          projectName: getDisplayProjectName(activeProject)
        });
      }
    }

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => setLanguage(button.dataset.language));
    });
    refreshPageButton.addEventListener("click", () => location.reload());
    const studentNames = {
      kopo01: "강태욱",
      kopo02: "고근민",
      kopo03: "고성인",
      kopo04: "김예담",
      kopo05: "박건률",
      kopo06: "박우성",
      kopo07: "박현영",
      kopo08: "박형빈",
      kopo09: "변재웅",
      kopo10: "황준열",
      kopo11: "이세윤",
      kopo12: "이승미",
      kopo13: "이재빈",
      kopo14: "전재용",
      kopo15: "정유라",
      kopo16: "조수원",
      kopo17: "주갑열",
      kopo18: "홍정찬",
      kopo19: "황지연",
      kopo20: "김시온",
      kopo21: "김여원",
      kopo22: "김정우",
      kopo23: "박상우",
      kopo24: "박현우",
      kopo25: "유혜린",
      kopo26: "이재훈",
      kopo27: "최리안",
      kopo29: "정윤호",
      kopo30: "박연우",
      kopo31: "서동재",
      kopo32: "강산",
      kopo33: "조현명"
    };

    function getProjectsApiUrl() {
      if (location.protocol === "file:") {
        return "http://localhost:703/api/projects";
      }

      return "/api/projects";
    }

    function getFrameCheckApiUrl(targetUrl) {
      const encodedUrl = encodeURIComponent(targetUrl);

      if (location.protocol === "file:") {
        return `http://localhost:703/api/frame-check?url=${encodedUrl}`;
      }

      return `/api/frame-check?url=${encodedUrl}`;
    }

    function getProjectViewApiUrl(projectId) {
      if (location.protocol === "file:") {
        return `http://localhost:703/api/projects/${projectId}/views`;
      }

      return `/api/projects/${projectId}/views`;
    }

    async function checkFrameStatus(targetUrl) {
      if (!targetUrl) {
        return { frameAllowed: false, reason: t("noLinkReason") };
      }

      if (frameCheckCache.has(targetUrl)) {
        return frameCheckCache.get(targetUrl);
      }

      const statusRequest = readJson(await fetch(getFrameCheckApiUrl(targetUrl)))
        .then((data) => ({
          checked: data.checked !== false,
          reachable: data.reachable !== false,
          notFound: Boolean(data.notFound),
          status: Number(data.status || 0),
          frameAllowed: Boolean(data.frameAllowed),
          reason: data.reason || ""
        }))
        .catch((error) => ({
          checked: false,
          frameAllowed: true,
          reason: t("iframeCheckFailed", { message: error.message })
        }));

      frameCheckCache.set(targetUrl, statusRequest);
      const status = await statusRequest;
      frameCheckCache.set(targetUrl, status);
      return status;
    }

    async function attachFrameStatuses(projects) {
      return Promise.all(projects.map(async (project) => ({
        ...project,
        frameStatus: project.frameStatus
          || (project.deploymentUrl ? await checkFrameStatus(project.deploymentUrl) : null)
      })));
    }

    function getMockupButtonLabel(project) {
      if (!project.deploymentUrl) return t("noLink");
      if (project.frameStatus && project.frameStatus.checked === false) return t("unavailable");
      if (project.frameStatus && project.frameStatus.reachable === false) return t("unavailable");
      if (project.frameStatus && project.frameStatus.frameAllowed === false) return t("openNewWindow");
      return t("portfolioButton");
    }

    function getMockupButtonClass(project) {
      if (project.frameStatus
        && (project.frameStatus.checked === false || project.frameStatus.reachable === false)) {
        return "mockup-link-button failed";
      }

      if (project.frameStatus && project.frameStatus.frameAllowed === false) {
        return "mockup-link-button warning";
      }

      return "mockup-link-button";
    }

    function getConnectionStatusMarkup(project) {
      if (!project.deploymentUrl) {
        return `<span class="connection-status failed">${escapeHtml(t("connectionCheckFailed"))}</span>`;
      }

      if (!project.frameStatus) {
        return `<span class="connection-status checking">${escapeHtml(t("checking"))}</span>`;
      }

      if (project.frameStatus.checked === false) {
        return `<span class="connection-status failed">${escapeHtml(t("unavailable"))}</span>`;
      }

      if (project.frameStatus.reachable === false) {
        if (project.frameStatus.notFound) {
          return `<span class="connection-status failed">${escapeHtml(t("page404"))}</span>`;
        }

        return `<span class="connection-status failed">HTTP ${project.frameStatus.status || escapeHtml(t("error"))}</span>`;
      }

      if (project.frameStatus.frameAllowed === false) {
        return `<span class="connection-status blocked">${escapeHtml(t("newWindowAvailable"))}</span>`;
      }

      return `<span class="connection-status available">${escapeHtml(t("available"))}</span>`;
    }

    function applyDeploymentButtonStatus(frameStatus) {
      if (!activeDeploymentUrl) return;

      if (frameStatus
        && (frameStatus.checked === false || frameStatus.reachable === false)) {
        openDeploymentButton.textContent = t("unavailable");
        openDeploymentButton.disabled = true;
        openDeploymentButton.classList.remove("warning");
        return;
      }

      openDeploymentButton.disabled = false;

      if (frameStatus && frameStatus.frameAllowed === false) {
        openDeploymentButton.textContent = t("openNewWindow");
        openDeploymentButton.classList.add("warning");
        return;
      }

      openDeploymentButton.textContent = t("openDeploymentMockup");
      openDeploymentButton.classList.remove("warning");
    }

    function formatViewCount(viewCount) {
      return t("viewCount", { count: Number(viewCount || 0) });
    }

    function incrementProjectViewCount(projectId) {
      const project = latestProjects.find((item) => Number(item.id) === Number(projectId));
      if (!project) return;

      project.viewCount = Number(project.viewCount || 0) + 1;
      document.querySelectorAll(`[data-view-count-project-id="${projectId}"]`).forEach((element) => {
        element.textContent = formatViewCount(project.viewCount);
      });
    }

    async function recordProjectView(projectId, eventType) {
      try {
        const response = await fetch(getProjectViewApiUrl(projectId), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ eventType })
        });
        await readJson(response);
        incrementProjectViewCount(projectId);
      } catch (error) {
        console.log(`조회수 기록 실패: ${error.message}`);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function formatCurrentTime(date) {
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-") + " " + [
        pad(date.getHours()),
        pad(date.getMinutes())
      ].join(":");
    }

    function updateCurrentTime() {
      document.getElementById("currentTime").textContent = formatCurrentTime(new Date());
    }

    function formatCommentTime(isoString) {
      const date = new Date(isoString);
      return formatCurrentTime(date);
    }

    async function readJson(response) {
      const contentType = response.headers.get("content-type") || "";

      if (!contentType.includes("application/json")) {
        const text = await response.text();
        throw new Error(text.trim().slice(0, 50) || t("jsonResponseError"));
      }

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || data.error || t("requestFailed"));
      }

      return data;
    }

    function renderProjectsTable() {
      projectsTable.innerHTML = latestUsers.map((user, index) => `
          <article class="user-row">
            <button class="user-name-button" type="button" data-user-index="${index}">
              <strong dir="ltr">${escapeHtml(user.studentId)}</strong>
              <span dir="auto">${escapeHtml(studentNames[user.studentId] || t("nameNotRegistered"))}</span>
            </button>
            <div class="project-card-list">
              ${user.projects.map((project) => `
                <section class="project-summary-card">
                  <div
                    class="project-summary-main"
                    role="button"
                    tabindex="0"
                    data-project-card-id="${project.id}"
                  >
                    <div class="project-summary-title">
                      <strong dir="auto">${escapeHtml(getDisplayProjectName(project))}</strong>
                      ${getConnectionStatusMarkup(project)}
                    </div>
                    ${project.screenshotUrl || project.screenshotPath ? `
                      <div class="project-summary-screenshot">
                        <img
                          src="${escapeHtml(project.screenshotUrl || project.screenshotPath)}"
                          alt="${escapeHtml(t("screenshotAlt", { projectName: project.projectName }))}"
                          loading="lazy"
                        >
                      </div>
                    ` : `
                      <div class="project-summary-screenshot empty" aria-hidden="true">
                        <span>${escapeHtml(t("screenshotPending"))}</span>
                      </div>
                    `}
                    <div class="project-progress-line">
                      <em data-view-count-project-id="${project.id}">${escapeHtml(formatViewCount(project.viewCount))}</em>
                    </div>
                  </div>
                  <button
                    class="${getMockupButtonClass(project)}"
                    type="button"
                    data-project-id="${project.id}"
                    data-mockup-url="${escapeHtml(project.deploymentUrl || "")}"
                    ${project.deploymentUrl
                      && (!project.frameStatus
                        || (project.frameStatus.checked !== false
                          && project.frameStatus.reachable !== false))
                      ? ""
                      : "disabled"}
                  >${escapeHtml(getMockupButtonLabel(project))}</button>
                </section>
              `).join("")}
              ${user.projects.length % 2 === 1 ? `
                <div class="project-summary-placeholder" aria-hidden="true"></div>
              ` : ""}
            </div>
          </article>
        `).join("");

      message.textContent = t("projectCount", {
        users: latestUsers.length,
        projects: latestProjects.length
      });
    }

    async function loadProjects() {
      try {
        const response = await fetch(getProjectsApiUrl());
        const data = await readJson(response);
        allProjects = data.projects;
        const completedProjects = allProjects.filter((project) => project.progress === "완료");

        latestProjects = completedProjects;
        latestUsers = groupProjectsByStudent(latestProjects);
        projectsLoaded = true;
        renderProjectsTable();

        latestProjects = await attachFrameStatuses(completedProjects);
        latestUsers = groupProjectsByStudent(latestProjects);
        renderProjectsTable();
      } catch (error) {
        message.textContent = t("errorMessage", { message: error.message });
      }
    }

    function groupProjectsByStudent(projects) {
      const groups = new Map();

      projects.forEach((project) => {
        if (!groups.has(project.studentId)) {
          groups.set(project.studentId, {
            studentId: project.studentId,
            projects: [],
            latestComment: "",
            latestUpdatedAt: ""
          });
        }

        const group = groups.get(project.studentId);
        group.projects.push(project);
        if (!group.latestUpdatedAt || new Date(project.updatedAt) > new Date(group.latestUpdatedAt)) {
          group.latestUpdatedAt = project.updatedAt;
        }
        if (project.latestComment) {
          group.latestComment = project.latestComment;
        }
      });

      return [...groups.values()].map((group) => ({
        ...group,
        projectNames: group.projects.map((project) => project.projectName).join(", ")
      }));
    }

    async function loadProjectDetail(projectId) {
      const response = await fetch(`${getProjectsApiUrl()}/${projectId}`);
      const data = await readJson(response);
      return data.project;
    }

    function renderComments(comments) {
      if (!comments.length) {
        modalCommentList.innerHTML = `<p class="empty-copy">${escapeHtml(t("noComments"))}</p>`;
        return;
      }

      modalCommentList.innerHTML = comments.map((comment) => `
        <article class="comment-card">
          <div class="comment-meta">
            <span class="comment-time">${escapeHtml(formatCommentTime(comment.createdAt))}</span>
            <span class="comment-author" dir="auto">${escapeHtml(comment.author === "anonymous" ? t("noAuthor") : comment.author || t("noAuthor"))}</span>
          </div>
          <div class="comment-copy" dir="auto">${escapeHtml(comment.comment)}</div>
        </article>
      `).join("");
    }

    function renderProjectScreenshot(project) {
      const screenshotPath = project.screenshotUrl || project.screenshotPath || "";

      if (!screenshotPath) {
        projectScreenshotBlock.innerHTML = `<p class="detail-copy">${escapeHtml(t("noScreenshot"))}</p>`;
        return;
      }

      const targetUrl = project.deploymentUrl || screenshotPath;
      projectScreenshotBlock.innerHTML = `
        <button class="screenshot-button" type="button" data-screenshot-target="${escapeHtml(targetUrl)}">
          <img src="${escapeHtml(screenshotPath)}" alt="${escapeHtml(t("screenshotAlt", { projectName: project.projectName }))}">
        </button>
      `;
    }

    async function openProjectModal(projectId) {
      const project = await loadProjectDetail(projectId);

      activeProjectId = project.id;
      activeDeploymentUrl = project.deploymentUrl || "";
      activeGithubUrl = project.githubUrl || "";
      activeFrameStatus = activeDeploymentUrl ? await checkFrameStatus(activeDeploymentUrl) : null;
      activeProject = project;
      activeComments = project.comments;
      modalStudentId.textContent = project.studentId;
      modalProjectName.textContent = getDisplayProjectName(project);
      renderProjectScreenshot(project);
      deploymentBlock.hidden = !activeDeploymentUrl;
      deploymentUrlText.textContent = activeDeploymentUrl;
      githubBlock.hidden = !activeGithubUrl;
      githubUrlText.textContent = activeGithubUrl;
      projectDescriptionBlock.hidden = !project.projectDescription;
      projectDescriptionText.textContent = project.projectDescription || "";
      applyDeploymentButtonStatus(activeFrameStatus);
      renderComments(project.comments);
      commentAuthorInput.value = "";
      commentInput.value = "";
      modal.classList.add("open");
      recordProjectView(project.id, "detail_view");
    }

    function openUserModal(user) {
      activeUser = user;
      userModalStudentId.textContent = user.studentId;
      renderUserProjectList(user);
      userModal.classList.add("open");
    }

    function renderUserProjectList(user) {
      const userProjects = allProjects.filter((project) => project.studentId === user.studentId);
      userProjectList.innerHTML = userProjects.map((project) => `
        <button class="project-option" type="button" data-project-id="${project.id}">
          <strong dir="auto">${escapeHtml(getDisplayProjectName(project))}</strong>
          <span>${escapeHtml(t("commentCount", { count: Number(project.commentCount || 0) }))}</span>
        </button>
      `).join("");
    }

    function closeUserModal() {
      userModal.classList.remove("open");
      activeUser = null;
    }

    function closeProjectModal() {
      modal.classList.remove("open");
      activeProjectId = null;
      activeFrameStatus = null;
      activeGithubUrl = "";
      activeProject = null;
      activeComments = [];
    }

    function openDeploymentFrame(title, url) {
      deploymentPreviewTitle.textContent = title;
      deploymentFrame.src = url;
      deploymentPreview.classList.add("open");
      deploymentPreview.setAttribute("aria-hidden", "false");
    }

    function openTimedExternalWindow(url) {
      const externalWindow = window.open(url, "_blank");
      if (!externalWindow) return false;

      try {
        externalWindow.opener = null;
      } catch {
        // Keep the window reference so the kiosk can still close it on time.
      }

      setTimeout(() => {
        if (!externalWindow.closed) {
          externalWindow.close();
          window.focus();
        }
      }, EXTERNAL_WINDOW_TIMEOUT_MS);

      return true;
    }

    async function openProjectDeployment(project) {
      if (!project || !project.deploymentUrl) return;

      try {
        const frameStatus = project.frameStatus || await checkFrameStatus(project.deploymentUrl);

        if (frameStatus.checked === false || frameStatus.reachable === false) {
          message.textContent = t("portfolioUnavailable");
          return;
        }

        if (!frameStatus.frameAllowed) {
          if (openTimedExternalWindow(project.deploymentUrl)) {
            recordProjectView(project.id, "external_open");
            message.textContent = t("iframeOpenedNew");
          }
          return;
        }

        openDeploymentFrame(t("deploymentMockupTitle", {
          projectName: getDisplayProjectName(project)
        }), project.deploymentUrl);
        recordProjectView(project.id, "mockup_view");
      } catch (error) {
        message.textContent = t("iframeCheckFailed", { message: error.message });
      }
    }

    async function openDeploymentPreview() {
      if (!activeDeploymentUrl) return;

      const project = {
        studentId: activeProject?.studentId || "",
        projectName: activeProject?.projectName || modalProjectName.textContent,
        id: activeProjectId,
        deploymentUrl: activeDeploymentUrl,
        frameStatus: activeFrameStatus
      };

      await openProjectDeployment(project);
    }

    function closeDeploymentPreview() {
      deploymentPreview.classList.remove("open");
      deploymentPreview.setAttribute("aria-hidden", "true");
      deploymentFrame.src = "about:blank";
    }

    projectsTable.addEventListener("click", async (event) => {
      const mockupButton = event.target.closest("[data-mockup-url]");
      if (mockupButton) {
        event.stopPropagation();
        const project = latestProjects.find((item) => String(item.id) === mockupButton.dataset.projectId);
        await openProjectDeployment(project);
        return;
      }

      const userButton = event.target.closest("[data-user-index]");
      if (userButton) {
        const user = latestUsers[Number(userButton.dataset.userIndex)];
        if (!user) return;

        try {
          openUserModal(user);
        } catch (error) {
          message.textContent = t("errorMessage", { message: error.message });
        }
        return;
      }

      const projectCard = event.target.closest("[data-project-card-id]");
      if (!projectCard) return;

      try {
        await openProjectModal(Number(projectCard.dataset.projectCardId));
      } catch (error) {
        message.textContent = t("errorMessage", { message: error.message });
      }
    });

    projectsTable.addEventListener("keydown", async (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      if (event.target.closest("[data-mockup-url]")) return;

      const projectCard = event.target.closest("[data-project-card-id]");
      if (!projectCard) return;

      event.preventDefault();
      try {
        await openProjectModal(Number(projectCard.dataset.projectCardId));
      } catch (error) {
        message.textContent = t("errorMessage", { message: error.message });
      }
    });

    userProjectList.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-project-id]");
      if (!button) return;

      try {
        closeUserModal();
        await openProjectModal(Number(button.dataset.projectId));
      } catch (error) {
        message.textContent = t("errorMessage", { message: error.message });
      }
    });

    commentForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!activeProjectId) return;

      try {
        await readJson(await fetch(`${getProjectsApiUrl()}/${activeProjectId}/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            author: commentAuthorInput.value,
            comment: commentInput.value
          })
        }));

        await openProjectModal(activeProjectId);
        await loadProjects();
      } catch (error) {
        message.textContent = t("errorMessage", { message: error.message });
      }
    });

    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeProjectModal();
      }
    });

    userModal.addEventListener("click", (event) => {
      if (event.target === userModal) {
        closeUserModal();
      }
    });

    closeUserModalButton.addEventListener("click", closeUserModal);
    closeModalButton.addEventListener("click", closeProjectModal);
    openDeploymentButton.addEventListener("click", openDeploymentPreview);
    openGithubButton.addEventListener("click", () => {
      if (activeGithubUrl) {
        window.open(activeGithubUrl, "_blank", "noopener");
      }
    });
    closeDeploymentButton.addEventListener("click", closeDeploymentPreview);
    projectScreenshotBlock.addEventListener("click", (event) => {
      const screenshotButton = event.target.closest("[data-screenshot-target]");
      if (!screenshotButton) return;

      window.open(screenshotButton.dataset.screenshotTarget, "_blank", "noopener");
    });
    projectScreenshotBlock.addEventListener("error", (event) => {
      if (event.target.tagName !== "IMG") return;
      projectScreenshotBlock.innerHTML = `<p class="detail-copy">${escapeHtml(t("noScreenshot"))}</p>`;
    }, true);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeDeploymentPreview();
        closeUserModal();
        closeProjectModal();
      }
    });

    setLanguage(currentI18n.locale, false);
    loadProjects();
    updateCurrentTime();
    setInterval(loadProjects, 30000);
    setInterval(updateCurrentTime, 1000);
  </script>
</body>
</html>
